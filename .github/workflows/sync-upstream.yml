# Keeps `main` and `unstable` in sync with the Codeberg upstream by merging
# it in on a schedule. Merge (rather than force-push) so local commits and
# this workflow file survive each sync — scheduled workflows only run from
# the default branch, so overwriting main would delete the workflow and
# stop the syncing, and unstable carries local commits not yet upstream.
# Caveat: if upstream ever rebases unstable, the merge here will conflict
# and the job will fail — resolve by manually resetting the branch.
name: Sync main from Codeberg upstream

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://codeberg.org/EarthGman/snowglobe-factory.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin main

      - name: Merge upstream/unstable and push
        run: |
          git fetch upstream unstable
          git checkout -B unstable origin/unstable
          git merge --no-edit upstream/unstable
          git push origin unstable
